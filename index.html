<style>

body {

width: 100%;

.btn {

.btn-outline {

height: 58px;

stroke: #1a7a47;
stroke-width: 5;
stroke-linecap: round;
transition: stroke-dashoffset 0.9s linear, stroke 0.3s;
}
.timer-num {

font-weight: 900;

}

.opt.wrong { background: #ffe4e4 !important; border-color: #d94444 !important; color: #b00; }
.opt.timeout { background: #fff3e0 !important; border-color: #e8a000 !important; }

font-size: 0.96rem;
margin-bottom: 14px;

// ── Firebase Realtime Database ─────────────────────────────────
// Base de datos compartida entre todos los dispositivos.
const FB_URL = 'https://trivia-9faf0-default-rtdb.firebaseio.com';

// Ruta de los puntajes de un día concreto.
function fbDayPath(dayKey) { return `${FB_URL}/scores/${dayKey}.json`; }

// Guarda un puntaje en Firebase (con copia local de respaldo).
async function fbSaveEntry(entry) {
try {
const bak = JSON.parse(localStorage.getItem('trivia_backup') || '[]');
bak.push(entry);
localStorage.setItem('trivia_backup', JSON.stringify(bak));
} catch {}
const res = await fetch(fbDayPath(entry.date), {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(entry)
});
if (!res.ok) throw new Error('Error al guardar (' + res.status + ')');
return res.json();
}

// Carga el ranking de un día (array de entradas).
async function fbLoadDay(dayKey) {
const res = await fetch(fbDayPath(dayKey));
if (!res.ok) throw new Error('Error al leer (' + res.status + ')');
const data = await res.json();
return data ? Object.values(data) : [];
}

// Carga el ranking histórico (todas las fechas combinadas).
async function fbLoadGlobal() {
const res = await fetch(`${FB_URL}/scores.json`);
if (!res.ok) throw new Error('Error al leer (' + res.status + ')');
const data = await res.json();
if (!data) return [];
const all = [];
Object.values(data).forEach(day => {
if (day) Object.values(day).forEach(e => all.push(e));
});
return all;
}

// Borra los puntajes de hoy en Firebase (afecta a todos los dispositivos).
async function fbClearDay(dayKey) {
const res = await fetch(fbDayPath(dayKey), { method: 'DELETE' });
if (!res.ok) throw new Error('Error al borrar (' + res.status + ')');
}

// ── Date helper ─────────────────────────────────────────────────
function todayKey() {
const d = new Date();
return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ── Utils ───────────────────────────────────────────────────────
function shuffle(arr) {
const a = [...arr];
for (let i = a.length-1; i > 0; i--) {
const j = Math.floor(Math.random()*(i+1));
[a[i],a[j]] = [a[j],a[i]];
}
return a;
}
function fmtTime(ms) { return (ms/1000).toFixed(1) + 's'; }
function fmtTotalTime(ms) { return Math.round(ms/1000) + ' seg'; }
function sortLB(lb) { return [...lb].sort((a,b) => b.score - a.score || a.totalMs - b.totalMs); }
function escapeHTML(s) {
return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function sameEntry(a, b) {
return a && b && a.name === b.name && a.score === b.score && a.totalMs === b.totalMs && a.date === b.date;
}

// ── State ───────────────────────────────────────────────────────
let state = {
screen: 'welcome',
name: '',
questions: [],
current: 0,
score: 0,
totalMs: 0,
qTimes: [],
answered: false,
selectedOpt: null,
timedOut: false,
saving: false,
lbTab: 'daily', // 'daily' | 'global'
// leaderboard fetch state
_lbLoading: false,
_lbError: null,
_lbData: [],
_myEntry: null,
// timer internals
_timerStart: null,
_timerInterval: null,
_timerRemaining: TIME_LIMIT
};

// ── Timer logic ─────────────────────────────────────────────────
function startTimer() {
clearInterval(state._timerInterval);
state._timerRemaining = TIME_LIMIT;
state._timerStart = Date.now();
state._timerInterval = setInterval(() => {
const elapsed = (Date.now() - state._timerStart) / 1000;
state._timerRemaining = Math.max(0, TIME_LIMIT - elapsed);
updateTimerUI();
if (state._timerRemaining <= 0) {
clearInterval(state._timerInterval);
handleTimeout();
}
}, 200);
}
function stopTimer() { clearInterval(state._timerInterval); }
function elapsedMs() { return state._timerStart ? Date.now() - state._timerStart : 0; }
function updateTimerUI() {
const numEl = document.getElementById('timerNum');
const fgEl = document.getElementById('timerFg');
if (!numEl || !fgEl) return;
const r = state._timerRemaining;
numEl.textContent = Math.ceil(r);
const urgent = r <= 10;
numEl.className = 'timer-num' + (urgent ? ' urgent' : '');
fgEl.className = 'timer-fg' + (urgent ? ' urgent' : '');
const circ = 150.796;
fgEl.style.strokeDasharray = circ;
fgEl.style.strokeDashoffset = circ * (1 - r / TIME_LIMIT);
}
function handleTimeout() {
state.answered = true;
state.timedOut = true;
state.selectedOpt = -1;
const spent = TIME_LIMIT * 1000;
state.qTimes.push(spent);
state.totalMs += spent;
render();
}

// ── Render ──────────────────────────────────────────────────────
function render() {
const card = document.getElementById('mainCard');
if (state.screen === 'welcome') card.innerHTML = welcomeHTML();
else if (state.screen === 'quiz') card.innerHTML = quizHTML();
else if (state.screen === 'result') card.innerHTML = resultHTML();
else if (state.screen === 'lb') card.innerHTML = lbHTML();
attachListeners();
if (state.screen === 'quiz') {
const circ = 150.796;
const fgEl = document.getElementById('timerFg');
if (fgEl) { fgEl.style.strokeDasharray = circ; fgEl.style.strokeDashoffset = 0; }
if (!state.answered) startTimer();
else updateTimerUI();
}
}

// ── Leaderboard rows builder ────────────────────────────────────
function lbRowsHTML(lb, limit, highlightEntry) {
const medals = ['🥇','🥈','🥉'];
return lb.slice(0, limit).map((e,i) => {
const isMe = highlightEntry && sameEntry(e, highlightEntry);
return `<tr class="${isMe?'me':''}">
<td><span class="medal">${medals[i]||i+1}</span></td>
<td>${escapeHTML(e.name)}</td>
<td style="text-align:center;font-weight:800;color:#0a5c30;">${e.score}</td>
<td style="text-align:center;color:#555;">${fmtTotalTime(e.totalMs)}</td>
</tr>`;
}).join('');
}

// ── HTML builders ───────────────────────────────────────────────
function welcomeHTML() {
return `
<h2>⚽ Trivia Copa Mundial</h2>
<p class="subtitle">Pon a prueba tu conocimiento futbolero. Responde ${TOTAL_Q} preguntas al azar.<br>
<strong>Cada pregunta vale ${PTS_PER_Q} puntos</strong> · <strong>Límite: ${TIME_LIMIT} segundos</strong> por pregunta.<br>
En caso de empate, gana quien respondió más rápido.</p>
<label style="font-weight:700;color:#0a5c30;font-size:0.93rem;display:block;margin-bottom:6px;">¿Cuál es tu nombre?</label>
<input type="text" id="nameInput" placeholder="Escribe tu nombre aquí..." maxlength="40">
<button class="btn" id="startBtn">¡Empezar Trivia! ⚽</button>
<button class="btn btn-outline" id="lbBtn" style="margin-top:10px;">🏆 Ver Tabla de Líderes</button>
`;
}

function quizHTML() {
const q = state.questions[state.current];
const prog = (state.current / TOTAL_Q) * 100;

const optsHTML = q.opts.map((o, i) => {
let cls = 'opt';
if (state.answered) {
if (i === q.ans) cls += ' correct';
else if (i === state.selectedOpt) cls += ' wrong';
else if (state.timedOut) cls += ' timeout';
}
return `<button class="${cls}" data-i="${i}" ${state.answered?'disabled':''}>${String.fromCharCode(65+i)}. ${o}</button>`;
}).join('');

let feedbackHTML = '';
if (state.answered) {
const tSpent = fmtTime(state.qTimes[state.qTimes.length-1]);
if (state.timedOut) {
feedbackHTML = `<div class="feedback timeout">⏱️ ¡Tiempo agotado! La respuesta correcta era: <strong>${q.opts[q.ans]}</strong></div>`;
} else if (state.selectedOpt === q.ans) {
feedbackHTML = `<div class="feedback ok">✅ ¡Correcto! <span class="time-badge">⏱ ${tSpent}</span></div>`;
} else {
feedbackHTML = `<div class="feedback fail">❌ Incorrecto. Correcta: <strong>${q.opts[q.ans]}</strong> <span class="time-badge">⏱ ${tSpent}</span></div>`;
}
}

const timeoutBanner = (state._timerRemaining <= 0 && !state.answered)
? `<div class="timeout-msg">⏱️ ¡Se acabó el tiempo!</div>` : '';

let nextBtn = '';
if (state.answered) {
const last = state.current >= TOTAL_Q - 1;
const label = state.saving ? 'Guardando…' : (last ? 'Ver resultados 🏁' : 'Siguiente →');
nextBtn = `<button class="btn" id="nextBtn" ${state.saving?'disabled':''}>${label}</button>`;
}

return `
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
<div class="score-chip">Puntos: ${state.score} · ${fmtTotalTime(state.totalMs)}</div>
</div>
<div class="prog-wrap"><div class="prog-bar" style="width:${prog}%"></div></div>
<div class="timer-row">
<div style="flex:1">
<div class="q-num">Pregunta ${state.current+1} de ${TOTAL_Q}</div>
<div class="q-text" style="margin-bottom:0">${q.q}</div>
</div>
<div class="timer-wrap">
<svg class="timer-svg" width="58" height="58" viewBox="0 0 58 58">
<circle class="timer-bg" cx="29" cy="29" r="24"/>
<circle class="timer-fg" id="timerFg" cx="29" cy="29" r="24"/>
</svg>
<div class="timer-num" id="timerNum">${TIME_LIMIT}</div>
</div>
</div>
<div class="options" style="margin-top:14px;">${optsHTML}</div>
${timeoutBanner}
${feedbackHTML}
${nextBtn}
`;
}

function resultHTML() {
const pct = Math.round((state.score / (TOTAL_Q * PTS_PER_Q)) * 100);
const emoji = pct >= 80 ? '🏆' : pct >= 60 ? '🌟' : pct >= 40 ? '👍' : '💪';
const msg = pct >= 80 ? '¡Experto mundialista!' : pct >= 60 ? '¡Muy buen resultado!' : pct >= 40 ? '¡Sigue practicando!' : '¡El fútbol guarda secretos para ti!';

let posText = '…';
let tableSection;
if (state._lbLoading) {
tableSection = '<p class="loading">⏳ Conectando con el ranking del día…</p>';
} else if (state._lbError) {
tableSection = `<p class="conn-error">⚠️ No se pudo conectar al ranking.<br>${escapeHTML(state._lbError)}<br>Tu puntaje quedó guardado localmente.</p>`;
} else {
const lb = sortLB(state._lbData || []);
const pos = lb.findIndex(e => sameEntry(e, state._myEntry)) + 1;
posText = pos || '–';
tableSection = lb.length === 0
? '<p class="empty">Sé el primero en la tabla.</p>'
: `<table><thead><tr><th>#</th><th>Nombre</th><th>Pts</th><th>Tiempo</th></tr></thead><tbody>${lbRowsHTML(lb, TOP_N, state._myEntry)}</tbody></table>`;
}

return `
<h2>${emoji} ${msg}</h2>
<div class="result-center">
<div class="big-score">${state.score}<span>/${TOTAL_Q*PTS_PER_Q}</span></div>
<div class="result-meta">${pct}% de aciertos · Posición <strong>#${posText}</strong> hoy</div>
<div class="result-time">⏱ Tiempo total: <strong>${fmtTotalTime(state.totalMs)}</strong></div>
</div>
<div class="lb-title">🏆 Top ${TOP_N} del Día</div>
${tableSection}
<div class="divider"></div>
<button class="btn" id="retryBtn">🔄 Jugar de nuevo</button>
<button class="btn btn-outline" id="lbBtnFull" style="margin-top:10px;">📊 Tabla completa</button>
`;
}

function lbHTML() {
const isDailyActive = state.lbTab === 'daily';
const dateLabel = isDailyActive ? `📅 Hoy (${todayKey()})` : '🌐 Histórico';

let tableSection;
if (state._lbLoading) {
tableSection = '<p class="loading">⏳ Cargando ranking desde Firebase…</p>';
} else if (state._lbError) {
tableSection = `<p class="conn-error">⚠️ No se pudo conectar al ranking.<br>${escapeHTML(state._lbError)}</p>`;
} else {
const lb = sortLB(state._lbData || []);
tableSection = lb.length === 0
? '<p class="empty">Aún no hay resultados registrados.</p>'
: `<table><thead><tr><th>#</th><th>Nombre</th><th>Pts</th><th>Tiempo</th></tr></thead><tbody>${lbRowsHTML(lb, isDailyActive ? TOP_N : 20, null)}</tbody></table>`;
}

return `
<h2>🏆 Tabla de Líderes</h2>
<p class="subtitle">54° Congreso Nacional de Cultivadores de Palma de Aceite 2026</p>
<div class="lb-tabs">
<button class="lb-tab ${isDailyActive?'active':''}" id="tabDaily">📅 Top ${TOP_N} del Día</button>
<button class="lb-tab ${!isDailyActive?'active':''}" id="tabGlobal">🌐 Histórico</button>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
<div style="font-size:0.78rem;color:#888;">${dateLabel}</div>
<button class="refresh-btn" id="refreshBtn">🔄 Actualizar</button>
</div>
${tableSection}
<div class="divider"></div>
<button class="btn" id="backBtn">← Volver al inicio</button>
<button class="btn btn-outline" id="clearDayBtn" style="margin-top:10px;font-size:0.82rem;padding:9px;">🗑️ Borrar puntajes de hoy (todos los dispositivos)</button>
`;
}

// ── Listeners ───────────────────────────────────────────────────
function attachListeners() {
const $ = id => document.getElementById(id);
$('nameInput') && $('nameInput').addEventListener('keydown', e => { if(e.key==='Enter') startGame(); });
$('startBtn') && $('startBtn').addEventListener('click', startGame);
$('lbBtn') && $('lbBtn').addEventListener('click', () => openLB('daily'));
$('lbBtnFull') && $('lbBtnFull').addEventListener('click', () => openLB('daily'));
$('nextBtn') && $('nextBtn').addEventListener('click', nextQ);
$('retryBtn') && $('retryBtn').addEventListener('click', () => { state.screen='welcome'; render(); });
$('backBtn') && $('backBtn').addEventListener('click', () => { state.screen='welcome'; render(); });
$('tabDaily') && $('tabDaily').addEventListener('click', () => openLB('daily'));
$('tabGlobal') && $('tabGlobal').addEventListener('click', () => openLB('global'));
$('refreshBtn') && $('refreshBtn').addEventListener('click', () => openLB(state.lbTab));
$('clearDayBtn') && $('clearDayBtn').addEventListener('click', clearDayHandler);
document.querySelectorAll('.opt:not([disabled])').forEach(btn =>
btn.addEventListener('click', () => selectOpt(+btn.dataset.i))
);
}

// ── Leaderboard loader ──────────────────────────────────────────
async function loadLeaderboard() {
state._lbLoading = true;
state._lbError = null;
try {
state._lbData = state.lbTab === 'daily' ? await fbLoadDay(todayKey()) : await fbLoadGlobal();
} catch (e) {
state._lbError = e.message || 'Sin conexión';
state._lbData = [];
}
state._lbLoading = false;
}

async function openLB(tab) {
state.lbTab = tab;
state.screen = 'lb';
state._lbLoading = true;
state._lbError = null;
state._lbData = [];
render(); // muestra "cargando"
await loadLeaderboard();
if (state.screen === 'lb') render();
}

async function clearDayHandler() {
if (!confirm('¿Borrar TODOS los puntajes de hoy? Esto afecta a TODOS los dispositivos y no se puede deshacer.')) return;
try {
await fbClearDay(todayKey());
} catch (e) {
alert('No se pudieron borrar los puntajes: ' + (e.message || e));
}
openLB(state.lbTab);
}

// ── Game logic ──────────────────────────────────────────────────
function startGame() {
const inp = document.getElementById('nameInput');
const name = inp ? inp.value.trim() : state.name;
if (!name) { inp && (inp.style.borderColor='#d94444'); return; }
state.name = name;
state.questions = shuffle(allQuestions).slice(0, TOTAL_Q);
state.current = 0;
state.score = 0;
state.totalMs = 0;
state.qTimes = [];
state.answered = false;
state.timedOut = false;
state.selectedOpt = null;
state.saving = false;
state._myEntry = null;
state.screen = 'quiz';
render();
}

function selectOpt(i) {
if (state.answered) return;
stopTimer();
const spent = elapsedMs();
state.qTimes.push(spent);
state.totalMs += spent;
state.selectedOpt = i;
state.answered = true;
state.timedOut = false;
if (i === state.questions[state.current].ans) state.score += PTS_PER_Q;
render();
}

async function nextQ() {
if (state.current < TOTAL_Q - 1) {
state.current++;
state.answered = false;
state.timedOut = false;
state.selectedOpt = null;
render();
return;
}
// Última pregunta: guardar en Firebase y mostrar resultados
stopTimer();
const entry = { name: state.name, score: state.score, totalMs: state.totalMs, date: todayKey(), ts: Date.now() };
state._myEntry = entry;
state.saving = true;
render(); // botón "Guardando…"

let saveError = null;
try {
await fbSaveEntry(entry);
} catch (e) {
saveError = e.message || 'Sin conexión';
}

state.saving = false;
state.screen = 'result';
state.lbTab = 'daily';

if (saveError) {
state._lbLoading = false;
state._lbError = saveError;
state._lbData = [];
render();
} else {
state._lbLoading = true;
render(); // muestra "cargando ranking"
await loadLeaderboard();
if (state.screen === 'result') render();
}
}

render();
</script>
